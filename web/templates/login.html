<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vega 登录</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width: 400px; margin-top: 15vh;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title text-center mb-3">Vega 登录</h5>
        <form id="loginForm">
          <input type="password" id="token" class="form-control mb-3" placeholder="请输入访问 token" required>
          <button type="submit" class="btn btn-primary w-100">登录</button>
          <div id="err" class="text-danger small mt-2" style="display:none">token 错误</div>
        </form>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const resp = await fetch('/api/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({token: document.getElementById('token').value})
      });
      if (resp.ok) { location.href = '/'; }
      else { document.getElementById('err').style.display = 'block'; }
    });
  </script>
</body>
</html>
