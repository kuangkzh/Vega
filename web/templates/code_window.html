<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/vega.svg') }}">
  <title>【Code】{{ project_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" rel="stylesheet">
</head>
<body>
<div id="app" v-cloak>
  <div v-if="loading" class="container text-center" style="margin-top:20vh;">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="text-muted mt-2">加载中…</div>
  </div>
  <div v-else class="container-fluid mt-3">
    <button type="button" class="btn btn-sm btn-outline-secondary d-md-none mb-2" @click="codeBrowseOpen = !codeBrowseOpen">
      [[ currentBrowsePath ]]<span class="ms-1">[[ codeBrowseOpen ? '▲' : '▼' ]]</span>
    </button>
    <div class="code-grid">
      <div class="code-sidebar d-md-flex" :class="{ 'is-open': codeBrowseOpen }">
        <div class="d-flex align-items-center gap-1 mb-2">
          <nav class="code-breadcrumb flex-grow-1">
            <a href="#" @click.prevent="browse('.')">根目录</a>
            <template v-for="s in pathSegments(browsePath)" :key="s.path">
              <span class="text-muted mx-1">/</span>
              <a href="#" @click.prevent="goPath(s.path, true)">[[ s.name ]]</a>
            </template>
          </nav>
          <button class="btn btn-sm btn-outline-secondary code-breadcrumb-up flex-shrink-0" title="上级目录" @click="browse('..')">↑</button>
        </div>
        <ul class="list-group code-file-list">
          <li v-for="(e, i) in browseEntries" :key="i" class="list-group-item py-1 d-flex align-items-center" :class="{ 'is-git-ignored': e.ignored }" :title="e.ignored ? '已被 .gitignore 忽略' : null">
            <a href="#" class="text-decoration-none flex-grow-1 text-truncate" @click.prevent="e.is_dir ? browseJoin(e.name) : openFile(browseJoinPath(e.name))">
              [[ e.is_dir ? '📁' : '📄' ]] [[ e.name ]]
            </a>
            <span v-if="e.statusLetters" class="git-diff-badge ms-1" :class="e.statusCls">[[ e.statusLetters ]]</span>
          </li>
        </ul>
      </div>
      <div class="code-main">
        <div class="card"><div class="card-body">
          <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
            <div class="d-flex align-items-center gap-1 min-w-0">
              <nav v-if="currentFilePath" class="code-breadcrumb">
                <a href="#" @click.prevent="browse('.')">根目录</a>
                <template v-for="s in pathSegments(currentFilePath, true)" :key="s.path">
                  <span class="text-muted mx-1">/</span>
                  <span v-if="s.isFile" class="fw-semibold">[[ s.name ]]</span>
                  <a v-else href="#" @click.prevent="goPath(s.path, true)">[[ s.name ]]</a>
                </template>
              </nav>
              <span v-else class="text-muted">选择文件</span>
              <span v-if="langLabel()" class="badge text-bg-light border flex-shrink-0">[[ langLabel() ]]</span>
            </div>
            <div class="d-flex gap-2 flex-shrink-0">
              <button class="btn btn-sm btn-outline-secondary" v-if="isMarkdownFile" @click="toggleMdPreview">[[ mdPreview ? '源码' : '预览' ]]</button>
              <button class="btn btn-sm btn-primary" @click="saveFile" v-if="currentFilePath && !mdPreview">保存</button>
            </div>
          </div>
          <textarea v-if="!mdPreview" ref="codeEditor" v-model="fileContent" class="form-control code-editor" placeholder="选择文件查看 / 编辑"></textarea>
          <div v-else class="md-preview md-body" v-html="renderMarkdown(fileContent)" @click="onMdClick"></div>
        </div></div>
      </div>
    </div>
    <div v-if="diffDetail" class="diff-popover-backdrop" @click.self="closeDiffDetail">
      <div class="diff-popover" ref="diffPopover" :style="{ top: diffDetail.top + 'px', left: diffDetail.left + 'px', width: diffDetail.width + 'px' }" @click.stop>
        <div class="diff-popover-sec">
          <div class="diff-popover-label text-danger">- 改动前（HEAD）</div>
          <div class="diff-view diff-view-old">
            <div v-for="(l, i) in diffDetail.oldLines" :key="'o' + i" class="diff-line"><span class="diff-ln">[[ l.no ]]</span><span class="diff-content">- [[ l.text ]]</span></div>
            <div v-if="!diffDetail.oldLines.length" class="diff-empty">（无）</div>
          </div>
        </div>
        <div class="diff-popover-sec">
          <div class="diff-popover-label text-success">+ 改动后（当前）</div>
          <div class="diff-view diff-view-new">
            <div v-for="(l, i) in diffDetail.newLines" :key="'n' + i" class="diff-line"><span class="diff-ln">[[ l.no ]]</span><span class="diff-content">+ [[ l.text ]]</span></div>
            <div v-if="!diffDetail.newLines.length" class="diff-empty">（无）</div>
          </div>
        </div>
        <div class="diff-popover-close" @click="closeDiffDetail" title="关闭">✕</div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/yaml/yaml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/shell/shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/sql/sql.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/state.js') }}"></script>
<script src="{{ url_for('static', filename='js/code.js') }}"></script>
<script src="{{ url_for('static', filename='js/git.js') }}"></script>
<script>
const app = Vue.createApp({
  delimiters: ['[[', ']]'],
  mixins: [window.CAState, window.CACode, window.CAGit],
  methods: {
    async api(url, opts) {
      const resp = await fetch(url, opts);
      if (resp.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
      return resp;
    },
  },
  async mounted() {
    const r = await fetch('/api/authed'); const d = await r.json();
    if (!d.authed) { location.href = '/login'; return; }
    this.loading = false;
    this.selectedProjectId = new URLSearchParams(location.search).get('project') || '';
    this.workspaceView = 'code';
    this.$nextTick(() => this.browse('.'));
  },
});
app.mount('#app');
</script>
</body>
</html>
