<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/vega.svg') }}">
  <title>【Diff】{{ project_name }}/{{ file_path }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/merge/merge.css" rel="stylesheet">
</head>
<body>
<div id="app" v-cloak>
  <div v-if="loading" class="container text-center" style="margin-top:20vh;">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="text-muted mt-2">加载中…</div>
  </div>
  <div v-else class="container-fluid mt-3">
    <div class="mb-2">
      <div class="fw-semibold text-truncate" style="max-width:100%;" :title="diffPath">[[ diffPath ]]</div>
      <div class="d-flex align-items-center gap-2 flex-wrap mt-1">
        <span class="text-muted small">旧版本</span>
        <select v-model="left" class="form-select form-select-sm" style="max-width:340px;" @change="onSideChange" title="选择旧版本">
          <option value="">（空）</option>
          <option value="working">工作区（未提交）</option>
          <option v-for="c in commits" :key="'l' + c.hash" :value="c.hash">[[ optionLabel(c) ]]</option>
        </select>
        <span class="text-muted">→</span>
        <span class="text-muted small">新版本</span>
        <select v-model="right" class="form-select form-select-sm" style="max-width:340px;" @change="onSideChange" title="选择新版本">
          <option value="">（空）</option>
          <option value="working">工作区（未提交）</option>
          <option v-for="c in commits" :key="'r' + c.hash" :value="c.hash">[[ optionLabel(c) ]]</option>
        </select>
      </div>
    </div>

    <div v-if="diffLoading" class="text-muted py-3">加载差异中…</div>
    <div v-else-if="diffErr" class="alert alert-warning">⚠ [[ diffErr ]]</div>
    <div v-else-if="diffBinary" class="text-muted py-3">二进制文件，无法显示行级差异</div>
    <div v-else ref="diffView" class="git-merge-view"></div>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/python/python.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/markdown/markdown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/yaml/yaml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/shell/shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/clike/clike.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/sql/sql.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/diff_match_patch/20121119/diff_match_patch.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/merge/merge.js"></script>
<script src="{{ url_for('static', filename='js/state.js') }}"></script>
<script src="{{ url_for('static', filename='js/gitdiff.js') }}"></script>
<script>
const app = Vue.createApp({
  delimiters: ['[[', ']]'],
  mixins: [window.CAState, window.CAGitDiff],
  methods: {
    async api(url, opts) {
      const resp = await fetch(url, opts);
      if (resp.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
      return resp;
    },
  },
  async mounted() {
    const r = await fetch('/api/authed'); const d = await r.json();
    if (!d.authed) { location.href = '/login'; return; }
    const q = new URLSearchParams(location.search);
    this.selectedProjectId = q.get('project') || '';
    this.diffPath = q.get('path') || '';
    this.loading = false;
    await this.loadCommits();
    if (q.get('working') === '1') {
      this.right = 'working';
      this.left = this.head;
    } else {
      const input = q.get('hash') || '';
      const sel = input
        ? (this.commits.find(c => c.hash === input) || this.commits.find(c => c.hash.startsWith(input)))
        : null;
      this.right = sel ? sel.hash : (this.commits.length ? this.commits[0].hash : this.head);
      const parent = await this.fetchParent(this.right);
      this.left = (parent && this.commits.some(c => c.hash === parent)) ? parent : '';
    }
    this.loadDiff();
  },
});
app.mount('#app');
</script>
</body>
</html>
