<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeAgent 控制台</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
<div id="app" v-cloak>

  <div v-if="loading" class="container text-center" style="margin-top:20vh;">
    <div class="spinner-border text-primary" role="status"></div>
    <div class="text-muted mt-2">加载中…</div>
  </div>

  <div v-else>
    {% include 'index/_nav.html' %}
    {% include 'index/_chat.html' %}
    {% include 'index/_code.html' %}
    {% include 'index/_git.html' %}
    {% include 'index/_tasks.html' %}
    {% include 'index/_settings.html' %}
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="{{ url_for('static', filename='js/state.js') }}"></script>
<script src="{{ url_for('static', filename='js/core.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
<script src="{{ url_for('static', filename='js/code.js') }}"></script>
<script src="{{ url_for('static', filename='js/git.js') }}"></script>
<script src="{{ url_for('static', filename='js/tasks.js') }}"></script>
<script src="{{ url_for('static', filename='js/settings.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
