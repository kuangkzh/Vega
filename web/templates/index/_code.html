<div v-if="tab==='code'" class="container-fluid mt-3">
  <button type="button" class="btn btn-sm btn-outline-secondary d-md-none mb-2 code-browse-toggle" @click="codeBrowseOpen = !codeBrowseOpen">
    [[ currentBrowsePath ]]<span class="ms-1">[[ codeBrowseOpen ? '▲' : '▼' ]]</span>
  </button>

  <div class="code-grid">
    <div class="code-sidebar d-md-flex" :class="{ 'is-open': codeBrowseOpen }">
      <button class="btn btn-sm btn-outline-secondary mb-2" @click="browse('..')">⬆ 上级目录</button>
      <ul class="list-group code-file-list">
        <li v-for="(e, i) in browseEntries" :key="i" class="list-group-item py-1 d-flex align-items-center">
          <a href="#" class="text-decoration-none flex-grow-1 text-truncate" @click.prevent="e.is_dir ? browseJoin(e.name) : openFile(browseJoinPath(e.name))">
            [[ e.is_dir ? '📁' : '📄' ]] [[ e.name ]]
          </a>
          <span v-if="e.statusLetters" class="git-diff-badge ms-1" :class="e.statusCls">[[ e.statusLetters ]]</span>
        </li>
      </ul>
    </div>

    <div class="code-main">
      <div class="card"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
          <span class="text-muted text-truncate">[[ currentFilePath || '选择文件' ]] <span v-if="langLabel()" class="badge text-bg-light border ms-1">[[ langLabel() ]]</span></span>
          <div class="d-flex gap-2 flex-shrink-0">
            <button class="btn btn-sm btn-outline-secondary" v-if="isMarkdownFile" @click="toggleMdPreview">[[ mdPreview ? '源码' : '预览' ]]</button>
            <button class="btn btn-sm btn-primary" @click="saveFile" v-if="currentFilePath && !mdPreview">保存</button>
          </div>
        </div>
        <textarea v-if="!mdPreview" ref="codeEditor" v-model="fileContent" class="form-control code-editor" placeholder="选择文件查看 / 编辑"></textarea>
        <div v-else class="md-preview md-body" v-html="renderMarkdown(fileContent)"></div>
      </div></div>
    </div>
  </div>

  <div v-if="diffDetail" class="diff-popover-backdrop" @click.self="closeDiffDetail">
    <div class="diff-popover" ref="diffPopover" :style="{ top: diffDetail.top + 'px', left: diffDetail.left + 'px', width: diffDetail.width + 'px' }" @click.stop>
      <div class="diff-popover-sec">
        <div class="diff-popover-label text-danger">- 改动前（HEAD）</div>
        <div class="diff-view diff-view-old">
          <div v-for="(l, i) in diffDetail.oldLines" :key="'o' + i" class="diff-line">
            <span class="diff-ln">[[ l.no ]]</span><span class="diff-content">- [[ l.text ]]</span>
          </div>
          <div v-if="!diffDetail.oldLines.length" class="diff-empty">（无）</div>
        </div>
      </div>
      <div class="diff-popover-sec">
        <div class="diff-popover-label text-success">+ 改动后（当前）</div>
        <div class="diff-view diff-view-new">
          <div v-for="(l, i) in diffDetail.newLines" :key="'n' + i" class="diff-line">
            <span class="diff-ln">[[ l.no ]]</span><span class="diff-content">+ [[ l.text ]]</span>
          </div>
          <div v-if="!diffDetail.newLines.length" class="diff-empty">（无）</div>
        </div>
      </div>
      <div class="diff-popover-close" @click="closeDiffDetail" title="关闭">✕</div>
    </div>
  </div>
</div>
