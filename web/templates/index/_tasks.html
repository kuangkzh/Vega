<div v-if="tab==='tasks'" class="container-fluid mt-3">
  <div class="d-flex mb-2 align-items-center">
    <select v-model="taskFilter" class="form-select w-auto me-2" @change="loadTasks">
      <option value="">全部状态</option>
      <option value="running">running</option>
      <option value="done">done</option>
      <option value="error">error</option>
      <option value="pending_approval">pending_approval</option>
      <option value="cancelled">cancelled</option>
    </select>
    <input v-model="taskNameFilter" class="form-control w-auto" placeholder="按任务名筛选" @keyup.enter="loadTasks">
    <button class="btn btn-outline-secondary ms-2" @click="loadTasks">刷新</button>
  </div>
  <div class="table-responsive">
  <table class="table table-sm table-bordered">
    <thead><tr><th>任务名</th><th>项目</th><th>执行时间</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>
      <tr v-for="t in tasks" :key="t.id">
        <td>[[ t.name ]]</td>
        <td>[[ projectLabel(t.project_id) ]]</td>
        <td>[[ t.start_time ]]</td>
        <td>[[ t.status ]]</td>
        <td>
          <button class="btn btn-sm btn-outline-secondary" @click="openTask(t.id)">详情</button>
          <button v-if="t.status==='pending_approval'" class="btn btn-sm btn-warning" @click="openTask(t.id)">审批</button>
        </td>
      </tr>
    </tbody>
  </table>
  </div>
</div>
